<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>风格 2 · 超级卡通</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    width:1280px; height:800px; overflow:hidden;
    background:linear-gradient(180deg,#4fc3f7 0%,#81ecec 55%,#a8e6a1 100%);
    font-family:'Comic Sans MS','Chalkboard SE','Microsoft YaHei',sans-serif;
    position:relative;
  }
  .cloud { position:absolute; background:#fff; border-radius:60px; opacity:.9;
    box-shadow:4px 4px 0 rgba(45,52,54,.12); }
  .cloud::before,.cloud::after { content:''; position:absolute; background:#fff; border-radius:50%; }
  .cl1 { width:150px; height:48px; top:80px; left:90px; }
  .cl1::before { width:60px; height:60px; top:-28px; left:24px; }
  .cl1::after { width:40px; height:40px; top:-18px; right:24px; }
  .cl2 { width:120px; height:40px; top:150px; right:130px; }
  .cl2::before { width:48px; height:48px; top:-22px; left:20px; }
  .cl2::after { width:34px; height:34px; top:-14px; right:20px; }
  .star { position:absolute; font-size:34px; transform:rotate(15deg); }
  .s1 { top:110px; left:330px; } .s2 { top:70px; right:330px; transform:rotate(-12deg); }
  .s3 { bottom:170px; left:200px; transform:rotate(-20deg); } .s4 { bottom:200px; right:230px; }

  .title {
    position:absolute; top:46px; left:0; right:0; text-align:center;
    font-size:58px; font-weight:900; color:#fff; letter-spacing:8px;
    -webkit-text-stroke:3px #2d3436; paint-order:stroke fill;
    text-shadow:0 7px 0 rgba(45,52,54,.22);
    transform:rotate(-2deg);
  }
  .hint {
    position:absolute; top:150px; left:50%; transform:translateX(-50%) rotate(1deg);
    background:#fff; border:4px solid #2d3436; border-radius:40px; padding:10px 28px;
    font-size:17px; font-weight:700; color:#2d3436; box-shadow:5px 5px 0 rgba(45,52,54,.25);
    white-space:nowrap;
  }
  .hint b { color:#e17055; }

  .badge {
    position:absolute; top:60px; right:56px; transform:rotate(4deg);
    background:#ffd93d; border:4px solid #2d3436; border-radius:22px;
    padding:12px 22px; font-size:17px; font-weight:900; color:#2d3436;
    box-shadow:5px 5px 0 rgba(45,52,54,.3);
  }
  .badge b { font-size:26px; color:#e17055; }

  .cards { position:absolute; top:280px; left:0; right:0; display:flex; gap:34px; justify-content:center; align-items:center; }
  .card {
    width:150px; height:210px; background:#fff; border-radius:22px;
    border:5px solid #2d3436; box-shadow:7px 8px 0 rgba(45,52,54,.28);
    position:relative; color:#2d3436;
  }
  .card:nth-child(1) { transform:rotate(-5deg) translateY(6px); }
  .card:nth-child(2) { transform:rotate(2deg) translateY(-8px); }
  .card:nth-child(3) { transform:rotate(5deg) translateY(4px); }
  .card:nth-child(4) { transform:rotate(-3deg); }
  .card .rk { position:absolute; top:8px; left:12px; font-size:38px; font-weight:900; line-height:1; }
  .card .st { position:absolute; top:52px; left:15px; font-size:26px; }
  .card .big { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-size:78px; }
  .card.red { color:#e63950; }
  .card .dot { position:absolute; right:10px; top:10px; width:18px; height:18px; background:#ffd93d;
    border:3px solid #2d3436; border-radius:50%; }
  .card.back { background:#ff6b9d; }
  .card.back::before {
    content:''; position:absolute; inset:10px; border-radius:14px;
    background-image:radial-gradient(#fff 22%, transparent 24%);
    background-size:28px 28px;
  }
  .card.back::after {
    content:'★'; position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    font-size:64px; color:#ffd93d; text-shadow:3px 3px 0 #2d3436;
  }

  .player {
    position:absolute; left:56px; bottom:56px; display:flex; align-items:center; gap:14px;
    background:#fff; border:4px solid #2d3436; border-radius:26px; padding:12px 24px 12px 12px;
    box-shadow:6px 6px 0 rgba(45,52,54,.28); transform:rotate(-1deg);
  }
  .player .av { width:56px; height:56px; background:#a8e6a1; border:4px solid #2d3436; border-radius:50%;
    display:flex; align-items:center; justify-content:center; font-size:30px; }
  .player .nm { font-size:20px; font-weight:900; color:#2d3436; }
  .player .tag { font-size:12px; color:#7f8c8d; font-weight:700; }
  .player .beers { font-size:22px; }

  .btn {
    position:absolute; right:60px; bottom:56px;
    background:#6bcf7f; color:#fff; border:5px solid #2d3436; border-radius:28px;
    padding:18px 46px; font-size:24px; font-weight:900; cursor:pointer;
    box-shadow:0 7px 0 #2d3436, 0 12px 0 rgba(45,52,54,.2);
    text-shadow:2px 2px 0 rgba(45,52,54,.35);
    font-family:'Comic Sans MS','Microsoft YaHei',sans-serif;
    transform:rotate(1deg);
  }
  .grass { position:absolute; bottom:0; left:0; right:0; height:90px;
    background:linear-gradient(180deg,rgba(107,207,127,0) 0%,rgba(88,186,108,.85) 100%); }
</style>
</head>
<body>
  <div class="cloud cl1"></div>
  <div class="cloud cl2"></div>
  <div class="star s1">⭐</div><div class="star s2">✨</div>
  <div class="star s3">🎈</div><div class="star s4">⭐</div>

  <div class="title">四轮酒局</div>
  <div class="hint">第 <b>3</b> 轮 · <b>十点半</b>　出 2 张凑 10.5 啦～</div>
  <div class="badge">罚酒 <b>×4</b> 🍺</div>

  <div class="cards">
    <div class="card"><div class="dot"></div><div class="rk">A</div><div class="st">♠</div><div class="big">♠</div></div>
    <div class="card red"><div class="dot"></div><div class="rk">K</div><div class="st">♥</div><div class="big">♥</div></div>
    <div class="card red"><div class="dot"></div><div class="rk">7</div><div class="st">♦</div><div class="big">♦</div></div>
    <div class="card back"></div>
  </div>

  <div class="player">
    <div class="av">🐯</div>
    <div><div class="nm">豹哥</div><div class="tag">激进型选手</div></div>
    <div class="beers">🍺🍺🍺</div>
  </div>

  <div class="grass"></div>
  <button class="btn">确认出牌！</button>
</body>
</html>
