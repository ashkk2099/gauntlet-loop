<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>风格 3 · 二次元</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    width:1280px; height:800px; overflow:hidden;
    background:linear-gradient(160deg,#ffeef5 0%,#f3e8ff 45%,#e0f2ff 100%);
    font-family:'Segoe UI','Microsoft YaHei',sans-serif;
    position:relative; color:#5a4a6a;
  }
  .bokeh { position:absolute; border-radius:50%; filter:blur(2px); opacity:.5; }
  .b1 { width:180px; height:180px; background:#ffd0e5; top:-40px; left:-40px; }
  .b2 { width:120px; height:120px; background:#c9e7ff; top:100px; right:80px; }
  .b3 { width:90px; height:90px; background:#e5d4ff; bottom:140px; left:120px; }
  .b4 { width:140px; height:140px; background:#ffe9c9; bottom:-30px; right:-20px; }
  .petal {
    position:absolute; width:16px; height:12px; background:#ffb7d5; opacity:.75;
    border-radius:80% 20% 80% 20%;
  }
  .p1 { top:120px; left:280px; transform:rotate(24deg); }
  .p2 { top:230px; right:260px; transform:rotate(-30deg); }
  .p3 { bottom:220px; left:380px; transform:rotate(60deg); }
  .p4 { top:90px; right:480px; transform:rotate(-15deg); }
  .p5 { bottom:300px; right:170px; transform:rotate(40deg); }

  .title {
    position:absolute; top:52px; left:0; right:0; text-align:center;
    font-size:52px; font-weight:800; letter-spacing:10px;
    background:linear-gradient(90deg,#ff7eb3,#9b7ede,#5ec6e8);
    -webkit-background-clip:text; background-clip:text; color:transparent;
    filter:drop-shadow(0 3px 10px rgba(255,126,179,.35));
  }
  .title small { display:block; font-size:14px; letter-spacing:8px; margin-top:8px;
    color:#b39ddb; -webkit-text-fill-color:#b39ddb; font-weight:600; }
  .hint {
    position:absolute; top:172px; left:50%; transform:translateX(-50%);
    background:rgba(255,255,255,.65); backdrop-filter:blur(6px);
    border:2px solid rgba(255,158,199,.6); border-radius:30px; padding:9px 26px;
    font-size:15px; color:#8a6fa8; white-space:nowrap;
    box-shadow:0 4px 18px rgba(155,125,222,.18);
  }
  .hint b { color:#ff6fa5; }

  .badge {
    position:absolute; top:56px; right:60px;
    background:rgba(255,255,255,.7); backdrop-filter:blur(6px);
    border:2px solid rgba(94,198,232,.55); border-radius:20px; padding:10px 20px;
    font-size:14px; color:#6aa8c9; box-shadow:0 4px 16px rgba(94,198,232,.22);
  }
  .badge b { font-size:24px; color:#ff8fb8; margin-left:6px; }

  .cards { position:absolute; top:290px; left:0; right:0; display:flex; gap:36px; justify-content:center; align-items:center; }
  .card {
    width:150px; height:210px; background:#fff; border-radius:18px;
    box-shadow:0 12px 30px rgba(155,125,222,.28), 0 2px 6px rgba(155,125,222,.18);
    position:relative; overflow:hidden; border:2px solid rgba(255,255,255,.9);
    color:#4a4a6a;
  }
  .card::after {
    content:''; position:absolute; top:-40%; left:-30%; width:80%; height:120%;
    background:linear-gradient(105deg,rgba(255,255,255,.75) 0%,rgba(255,255,255,0) 60%);
    transform:rotate(12deg); pointer-events:none;
  }
  .card .rk { position:absolute; top:10px; left:14px; font-size:34px; font-weight:800; line-height:1; }
  .card .st { position:absolute; top:50px; left:16px; font-size:24px; }
  .card .big { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-size:76px; opacity:.92; }
  .card.red { color:#ff6f9c; }
  .card .shine { position:absolute; bottom:10px; right:12px; font-size:14px; color:#d9c8ff; }
  .card.back {
    background:linear-gradient(135deg,#ff9ec7 0%,#b39ddb 55%,#7fd4ff 100%);
    border:none;
  }
  .card.back::before {
    content:'✿'; position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    font-size:66px; color:rgba(255,255,255,.95); text-shadow:0 4px 14px rgba(255,255,255,.5);
  }
  .card.back::after {
    content:''; position:absolute; inset:12px; border-radius:12px;
    border:2px solid rgba(255,255,255,.65); background:none; transform:none;
  }

  .player {
    position:absolute; left:60px; bottom:60px; display:flex; align-items:center; gap:14px;
    background:rgba(255,255,255,.72); backdrop-filter:blur(8px);
    border:2px solid rgba(255,158,199,.5); border-radius:26px; padding:12px 26px 12px 12px;
    box-shadow:0 8px 24px rgba(255,126,179,.22);
  }
  .player .av { width:54px; height:54px; border-radius:50%;
    background:linear-gradient(135deg,#ffd0e5,#c9e7ff);
    border:3px solid #fff; box-shadow:0 3px 10px rgba(255,126,179,.3);
    display:flex; align-items:center; justify-content:center; font-size:28px; }
  .player .nm { font-size:19px; font-weight:700; color:#6a5a8a; }
  .player .tag { font-size:12px; color:#b39ddb; }
  .player .beers { font-size:20px; }

  .btn {
    position:absolute; right:64px; bottom:58px;
    background:linear-gradient(90deg,#ff8fb8,#ff6fa5); color:#fff;
    border:none; border-radius:40px; padding:17px 48px; font-size:19px; font-weight:700;
    letter-spacing:4px; cursor:pointer;
    box-shadow:0 8px 26px rgba(255,111,165,.45), inset 0 2px 0 rgba(255,255,255,.5);
    font-family:'Segoe UI','Microsoft YaHei',sans-serif;
  }
  .ribbon { position:absolute; left:50%; bottom:64px; transform:translateX(-50%);
    font-size:13px; color:#c3aede; letter-spacing:3px; }
</style>
</head>
<body>
  <div class="bokeh b1"></div><div class="bokeh b2"></div>
  <div class="bokeh b3"></div><div class="bokeh b4"></div>
  <div class="petal p1"></div><div class="petal p2"></div><div class="petal p3"></div>
  <div class="petal p4"></div><div class="petal p5"></div>

  <div class="title">四轮酒局<small>よんりん · 今夜も乾杯 ♪</small></div>
  <div class="hint">第 <b>3</b> 轮 · <b>十点半</b>　—　出 2 张凑 10.5 哟</div>
  <div class="badge">罚酒<b>×4</b> 🍺</div>

  <div class="cards">
    <div class="card"><div class="rk">A</div><div class="st">♠</div><div class="big">♠</div><div class="shine">✦</div></div>
    <div class="card red"><div class="rk">K</div><div class="st">♥</div><div class="big">♥</div><div class="shine">✦</div></div>
    <div class="card red"><div class="rk">7</div><div class="st">♦</div><div class="big">♦</div><div class="shine">✦</div></div>
    <div class="card back"></div>
  </div>

  <div class="player">
    <div class="av">🐯</div>
    <div><div class="nm">豹哥</div><div class="tag">激进型选手</div></div>
    <div class="beers">🍺🍺🍺</div>
  </div>

  <div class="ribbon">～ 今 夜 一 起 干 杯 ～</div>
  <button class="btn">确认出牌 ✨</button>
</body>
</html>
