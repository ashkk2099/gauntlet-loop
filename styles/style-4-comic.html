<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>风格 4 · 漫画</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    width:1280px; height:800px; overflow:hidden;
    background:#fdf6e3; color:#111;
    font-family:'Arial Black','Microsoft YaHei',sans-serif;
    position:relative;
  }
  /* 半调网点 */
  .halftone {
    position:absolute; inset:0;
    background-image:radial-gradient(rgba(0,0,0,.13) 20%, transparent 22%);
    background-size:14px 14px;
  }
  /* 集中线 */
  .speed {
    position:absolute; inset:0; opacity:.5;
    background:repeating-conic-gradient(from 0deg at 50% 46%, transparent 0deg 5deg, rgba(0,0,0,.06) 5deg 6.5deg);
  }

  .burst {
    position:absolute; top:26px; left:50%; transform:translateX(-50%) rotate(-3deg);
    background:#ffd60a; padding:26px 66px;
    clip-path:polygon(0% 30%,8% 8%,20% 22%,32% 0%,44% 18%,56% 2%,68% 20%,80% 4%,90% 24%,100% 18%,96% 42%,100% 60%,92% 78%,98% 95%,78% 88%,66% 100%,52% 86%,38% 100%,26% 84%,10% 92%,4% 70%,0% 60%);
    z-index:2;
  }
  .burst .t {
    font-size:52px; font-weight:900; letter-spacing:6px; color:#111;
    transform:rotate(2deg); white-space:nowrap;
  }
  .hint {
    position:absolute; top:168px; left:50%; transform:translateX(-50%);
    background:#fff; border:4px solid #111; padding:10px 26px;
    font-size:16px; font-weight:700; white-space:nowrap;
    box-shadow:6px 6px 0 #111; font-family:'Microsoft YaHei',sans-serif;
  }
  .hint b { color:#e63946; }

  /* 对话框式徽章 */
  .badge {
    position:absolute; top:70px; right:60px;
    background:#fff; border:4px solid #111; border-radius:24px;
    padding:12px 22px; font-size:16px; font-weight:900;
    box-shadow:5px 5px 0 #111; transform:rotate(3deg);
  }
  .badge::before {
    content:''; position:absolute; left:-16px; top:26px;
    border:8px solid transparent; border-right:14px solid #111;
  }
  .badge b { color:#e63946; font-size:24px; }

  .cards { position:absolute; top:290px; left:0; right:0; display:flex; gap:38px; justify-content:center; align-items:center; }
  .card {
    width:150px; height:210px; background:#fff;
    border:4px solid #111; box-shadow:8px 8px 0 #111;
    position:relative; color:#111;
  }
  .card:nth-child(1){ transform:rotate(-4deg); } .card:nth-child(2){ transform:rotate(1.5deg) translateY(-6px); }
  .card:nth-child(3){ transform:rotate(4deg); } .card:nth-child(4){ transform:rotate(-2deg); }
  .card .rk { position:absolute; top:6px; left:10px; font-size:38px; font-weight:900; line-height:1; }
  .card .st { position:absolute; top:50px; left:13px; font-size:26px; }
  .card .big { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-size:80px; }
  .card.red { color:#e63946; }
  .card .act {
    position:absolute; inset:8px; opacity:.15; pointer-events:none;
    background:repeating-linear-gradient(-35deg, transparent 0 8px, #111 8px 10px);
  }
  .card.back { background:#e63946; }
  .card.back::before {
    content:''; position:absolute; inset:10px; border:3px solid #fff;
    background-image:radial-gradient(rgba(255,255,255,.9) 22%, transparent 24%);
    background-size:20px 20px;
  }
  .card.back::after {
    content:'干!'; position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    font-size:56px; font-weight:900; color:#ffd60a;
    text-shadow:3px 3px 0 #111; font-family:'Microsoft YaHei',sans-serif;
  }

  /* 音效词 */
  .sfx { position:absolute; font-weight:900; color:#e63946; z-index:3;
    text-shadow:3px 3px 0 #fff, 5px 5px 0 #111; }
  .x1 { top:250px; left:120px; font-size:44px; transform:rotate(-14deg); }
  .x2 { top:520px; right:110px; font-size:40px; transform:rotate(10deg); color:#1d9bf0; }

  .player {
    position:absolute; left:56px; bottom:60px; display:flex; align-items:center; gap:14px;
    background:#fff; border:4px solid #111; padding:12px 26px 12px 12px;
    box-shadow:7px 7px 0 #111; transform:rotate(-1deg);
    font-family:'Microsoft YaHei',sans-serif;
  }
  .player .av { width:56px; height:56px; background:#ffd60a; border:4px solid #111; border-radius:50%;
    display:flex; align-items:center; justify-content:center; font-size:30px; }
  .player .nm { font-size:20px; font-weight:900; }
  .player .tag { font-size:12px; color:#666; font-weight:700; }
  .player .beers { font-size:22px; }

  .btn {
    position:absolute; right:60px; bottom:60px;
    background:#ffd60a; color:#111; border:5px solid #111;
    padding:18px 46px; font-size:24px; font-weight:900; cursor:pointer;
    box-shadow:8px 8px 0 #111; letter-spacing:3px;
    font-family:'Microsoft YaHei',sans-serif;
    transform:rotate(-1deg);
  }
</style>
</head>
<body>
  <div class="speed"></div>
  <div class="halftone"></div>

  <div class="burst"><div class="t">四轮酒局!!</div></div>
  <div class="hint">第 <b>3</b> 轮 · <b>十点半</b>　—　出 2 张凑 10.5，最远者罚酒！</div>
  <div class="badge">罚酒 <b>×4</b>!!</div>

  <div class="sfx x1">干杯!!</div>
  <div class="sfx x2">咕咚…</div>

  <div class="cards">
    <div class="card"><div class="act"></div><div class="rk">A</div><div class="st">♠</div><div class="big">♠</div></div>
    <div class="card red"><div class="act"></div><div class="rk">K</div><div class="st">♥</div><div class="big">♥</div></div>
    <div class="card red"><div class="act"></div><div class="rk">7</div><div class="st">♦</div><div class="big">♦</div></div>
    <div class="card back"></div>
  </div>

  <div class="player">
    <div class="av">🐯</div>
    <div><div class="nm">豹哥</div><div class="tag">激进型选手</div></div>
    <div class="beers">🍺🍺🍺</div>
  </div>

  <button class="btn">确认出牌!!</button>
</body>
</html>
